<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Confirmed | MAINSTREAM™</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f5ef;
    color:#111;
}

/* HEADER */

header{
    height:80px;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
}

.logo{
    height:42px;
    width:auto;
}

.nav{
    display:flex;
    align-items:center;
    gap:28px;
}

.nav a{
    color:white;
    text-decoration:none;
    font-size:13px;
    letter-spacing:1.5px;
}

.nav a:last-child{
    color:#f5d547;
}

/* MAIN */

.confirmation{
    width:92%;
    max-width:900px;
    margin:55px auto 80px;
    text-align:center;
}

/* CHECK */

.check-circle{
    width:135px;
    height:135px;
    margin:0 auto 35px;
    border-radius:50%;
    background:#f5d547;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:75px;
    font-weight:bold;
}

/* TITLE */

.confirmation h1{
    font-size:48px;
    letter-spacing:3px;
    margin-bottom:18px;
}

.subtitle{
    font-size:19px;
    color:#666;
    line-height:1.5;
    margin-bottom:45px;
}

/* ORDER BOX */

.order-box{
    background:white;
    border:1px solid #ddd;
    text-align:left;
    padding:35px;
}

.order-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    padding-bottom:22px;
    border-bottom:1px solid #ddd;
}

.order-header h2{
    font-size:24px;
    letter-spacing:1px;
}

.order-number{
    color:#666;
    font-size:14px;
}

/* ITEMS */

.order-items{
    margin-top:10px;
}

.order-item{
    display:flex;
    align-items:center;
    gap:20px;
    padding:22px 0;
    border-bottom:1px solid #eee;
}

.order-image{
    width:85px;
    height:100px;
    background:#f3f3f3;
    overflow:hidden;
    flex-shrink:0;
}

.order-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.order-info{
    flex:1;
}

.order-info h3{
    font-size:16px;
    margin-bottom:8px;
    letter-spacing:.5px;
}

.order-info p{
    color:#777;
    font-size:13px;
    margin:4px 0;
}

.order-price{
    font-size:17px;
    font-weight:bold;
}

/* TOTAL */

.total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-top:25px;
    padding-top:25px;

    border-top:2px solid #111;
}

.total-row span{
    font-size:20px;
    font-weight:bold;
    letter-spacing:1px;
}

.total-price{
    font-size:25px;
}

/* PAYMENT */

.payment-info{
    margin-top:22px;
    padding:18px;
    background:#f7f5ef;
    font-size:14px;
    color:#555;
}

.payment-info strong{
    color:#111;
}

/* BUTTONS */

.buttons{
    display:flex;
    gap:15px;
    margin-top:30px;
}

.buttons a{
    flex:1;
    text-decoration:none;
    text-align:center;
    padding:17px 20px;

    font-size:13px;
    font-weight:bold;
    letter-spacing:1px;
}

.shop-btn{
    background:#f5d547;
    color:#111;
}

.home-btn{
    background:#111;
    color:white;
}

/* DEMO NOTE */

.demo-note{
    margin-top:45px;
    color:#777;
    font-size:13px;
    line-height:1.6;
}

/* MOBILE */

@media(max-width:600px){

    header{
        height:70px;
        padding:0 20px;
    }

    .logo{
        height:34px;
    }

    .nav{
        gap:15px;
    }

    .nav a{
        font-size:10px;
    }

    .confirmation{
        width:94%;
        margin:40px auto 60px;
    }

    .check-circle{
        width:105px;
        height:105px;
        font-size:58px;
        margin-bottom:28px;
    }

    .confirmation h1{
        font-size:34px;
        letter-spacing:2px;
    }

    .subtitle{
        font-size:16px;
        margin-bottom:30px;
    }

    .order-box{
        padding:20px;
    }

    .order-header{
        align-items:flex-start;
        flex-direction:column;
        gap:8px;
    }

    .order-header h2{
        font-size:20px;
    }

    .order-item{
        gap:12px;
    }

    .order-image{
        width:70px;
        height:85px;
    }

    .order-info h3{
        font-size:13px;
    }

    .order-info p{
        font-size:11px;
    }

    .order-price{
        font-size:14px;
    }

    .total-row span{
        font-size:17px;
    }

    .total-price{
        font-size:21px;
    }

    .buttons{
        flex-direction:column;
    }

}

</style>
</head>


<body>


<!-- HEADER -->

<header>

<a href="index.html">
<img
src="mainstream-logo.png"
class="logo"
alt="MAINSTREAM">
</a>

<nav class="nav">

<a href="index.html">HOME</a>

<a href="shop.html">SHOP</a>

<a href="cart.html">CART</a>

</nav>

</header>


<!-- CONFIRMATION -->

<main class="confirmation">


<div class="check-circle">
✓
</div>


<h1>
ORDER CONFIRMED
</h1>


<p class="subtitle">
Thank you for shopping with MAINSTREAM™.<br>
Your order has been successfully placed.
</p>


<div class="order-box">


<div class="order-header">

<h2>
ORDER DETAILS
</h2>

<div class="order-number">
ORDER #<span id="orderNumber"></span>
</div>

</div>


<div
class="order-items"
id="orderItems">
</div>


<div class="total-row">

<span>
TOTAL
</span>

<span
class="total-price"
id="orderTotal">
₹0
</span>

</div>


<div class="payment-info">

PAYMENT METHOD:
<strong id="paymentMethod">
—
</strong>

</div>


</div>


<div class="buttons">

<a
href="shop.html"
class="shop-btn">
CONTINUE SHOPPING
</a>

<a
href="index.html"
class="home-btn">
BACK TO HOME
</a>

</div>


<p class="demo-note">

This is a demo order confirmation.
No real payment has been processed.

</p>


</main>


<script>

/* ==============================
   GET PRICE
============================== */

function getPrice(price){

    if(typeof price === "number"){
        return price;
    }

    return parseInt(
        String(price)
        .replace(/[^\d]/g,"")
    ) || 0;
}


/* ==============================
   GET ORDER
============================== */

function getOrder(){

    try{

        const savedOrder =
            JSON.parse(
                localStorage.getItem(
                    "mainstreamOrder"
                )
            );

        if(
            savedOrder &&
            Array.isArray(savedOrder.items) &&
            savedOrder.items.length > 0
        ){

            return savedOrder;
        }


        /* BUY NOW FALLBACK */

        const buyNow =
            JSON.parse(
                localStorage.getItem(
                    "mainstreamBuyNow"
                )
            );


        if(buyNow){

            const items =
                Array.isArray(buyNow)
                ? buyNow
                : [buyNow];


            return {

                items:items,

                payment:
                    localStorage.getItem(
                        "mainstreamPaymentMethod"
                    ) || "Demo Payment",

                total:items.reduce(
                    function(sum,item){

                        return sum +
                            getPrice(item.price) *
                            (Number(item.quantity) || 1);

                    },
                    0
                )

            };

        }


        /* NORMAL CART FALLBACK */

        const cart =
            JSON.parse(
                localStorage.getItem(
                    "mainstreamCart"
                )
            ) || [];


        return {

            items:cart,

            payment:
                localStorage.getItem(
                    "mainstreamPaymentMethod"
                ) || "Demo Payment",

            total:cart.reduce(
                function(sum,item){

                    return sum +
                        getPrice(item.price) *
                        (Number(item.quantity) || 1);

                },
                0
            )

        };


    }catch(error){

        return {
            items:[],
            payment:"Demo Payment",
            total:0
        };

    }

}


/* ==============================
   GENERATE ORDER NUMBER
============================== */

function getOrderNumber(){

    let number =
        localStorage.getItem(
            "mainstreamOrderNumber"
        );


    if(!number){

        number =
            "MS" +
            Math.floor(
                100000 +
                Math.random() * 900000
            );

        localStorage.setItem(
            "mainstreamOrderNumber",
            number
        );

    }


    return number;

}


/* ==============================
   DISPLAY ORDER
============================== */

function renderOrder(){

    const order =
        getOrder();


    const itemsContainer =
        document.getElementById(
            "orderItems"
        );


    const totalElement =
        document.getElementById(
            "orderTotal"
        );


    const paymentElement =
        document.getElementById(
            "paymentMethod"
        );


    const orderNumberElement =
        document.getElementById(
            "orderNumber"
        );


    orderNumberElement.textContent =
        getOrderNumber();


    paymentElement.textContent =
        formatPaymentMethod(
            order.payment
        );


    itemsContainer.innerHTML = "";


    let total = 0;


    if(
        !order.items ||
        order.items.length === 0
    ){

        itemsContainer.innerHTML = `

            <div
            style="
            padding:30px 0;
            color:#777;
            text-align:center;
            ">

            Order details are unavailable.

            </div>

        `;

        totalElement.textContent =
            "₹0";

        return;

    }


    order.items.forEach(
        function(item){

            const price =
                getPrice(item.price);


            const quantity =
                Number(item.quantity) || 1;


            const itemTotal =
                price * quantity;


            total += itemTotal;


            const itemElement =
                document.createElement(
                    "div"
                );


            itemElement.className =
                "order-item";


            itemElement.innerHTML = `

                <div class="order-image">

                    <img
                    src="${item.image || 'mainstream-logo.png'}"
                    alt="${item.name || 'Product'}"
                    onerror="
                    this.src='mainstream-logo.png'
                    ">

                </div>


                <div class="order-info">

                    <h3>
                    ${item.name || "PRODUCT"}
                    </h3>

                    <p>
                    SIZE:
                    ${item.size || "M"}
                    </p>

                    <p>
                    QUANTITY:
                    ${quantity}
                    </p>

                    <p>
                    UNIT PRICE:
                    ₹${price.toLocaleString("en-IN")}
                    </p>

                </div>


                <div class="order-price">

                    ₹${itemTotal.toLocaleString("en-IN")}

                </div>

            `;


            itemsContainer.appendChild(
                itemElement
            );

        }
    );


    totalElement.textContent =
        "₹" +
        total.toLocaleString(
            "en-IN"
        );

}


/* ==============================
   PAYMENT NAME
============================== */

function formatPaymentMethod(method){

    if(!method){
        return "Demo Payment";
    }


    if(method === "card"){
        return "Credit / Debit Card";
    }


    if(method === "upi"){
        return "UPI";
    }


    if(method === "cod"){
        return "Cash on Delivery";
    }


    return method;

}


/* ==============================
   START
============================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        renderOrder();

    }
);

</script>


</body>
  </html>
