<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cart | MAINSTREAM™</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    color:#111;
}

header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    border-bottom:1px solid #eee;
}

.logo{
    width:150px;
    height:auto;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    text-decoration:none;
    color:#111;
    font-size:14px;
    font-weight:600;
}

.cart-title{
    padding:35px 25px 20px;
    font-size:28px;
    font-weight:700;
}

.cart-container{
    padding:0 25px 50px;
    max-width:1000px;
    margin:auto;
}

.cart-item{
    display:flex;
    gap:20px;
    padding:20px 0;
    border-bottom:1px solid #ddd;
}

.cart-item img{
    width:110px;
    height:130px;
    object-fit:cover;
    background:#f5f5f5;
}

.item-details{
    flex:1;
}

.item-name{
    font-size:17px;
    font-weight:700;
    margin-bottom:8px;
}

.item-info{
    font-size:14px;
    color:#555;
    margin-bottom:6px;
}

.item-price{
    font-size:16px;
    font-weight:700;
}

.remove-btn{
    margin-top:12px;
    border:none;
    background:#111;
    color:#fff;
    padding:8px 14px;
    cursor:pointer;
    font-size:12px;
}

.cart-summary{
    margin-top:30px;
    padding:25px;
    background:#f7f7f7;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    font-size:16px;
}

.total{
    font-size:20px;
    font-weight:700;
    border-top:1px solid #ccc;
    padding-top:15px;
}

.checkout-btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    background:#111;
    color:#fff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.empty-cart{
    text-align:center;
    padding:80px 20px;
}

.empty-cart h2{
    margin-bottom:15px;
}

.shop-btn{
    display:inline-block;
    margin-top:20px;
    padding:14px 25px;
    background:#111;
    color:#fff;
    text-decoration:none;
    font-weight:600;
}

@media(max-width:600px){

    header{
        padding:0 15px;
    }

    .logo{
        width:125px;
    }

    nav{
        gap:12px;
    }

    nav a{
        font-size:12px;
    }

    .cart-title{
        padding:25px 15px 15px;
        font-size:24px;
    }

    .cart-container{
        padding:0 15px 40px;
    }

    .cart-item{
        gap:14px;
    }

    .cart-item img{
        width:90px;
        height:110px;
    }

    .item-name{
        font-size:15px;
    }
}
</style>
</head>

<body>

<header>

    <a href="index.html">
        <img src="mainstream-logo.png" class="logo" alt="MAINSTREAM">
    </a>

    <nav>
        <a href="index.html">HOME</a>
        <a href="shop.html">SHOP</a>
        <a href="cart.html">CART</a>
    </nav>

</header>

<h1 class="cart-title">YOUR CART</h1>

<div class="cart-container">

    <div id="cartItems"></div>

    <div id="cartSummary"></div>

</div>

<script>

let cart =
    JSON.parse(
        localStorage.getItem("mainstreamCart")
    ) || [];


function getPrice(price){

    if(typeof price === "number"){
        return price;
    }

    return parseInt(
        String(price).replace(/[^\d]/g,"")
    ) || 0;
}


function renderCart(){

    const container =
        document.getElementById("cartItems");

    const summary =
        document.getElementById("cartSummary");


    if(cart.length === 0){

        container.innerHTML = `
            <div class="empty-cart">

                <h2>Your cart is empty</h2>

                <p>
                    Add some products to your cart.
                </p>

                <a
                    href="shop.html"
                    class="shop-btn"
                >
                    SHOP NOW
                </a>

            </div>
        `;

        summary.innerHTML = "";

        return;
    }


    let subtotal = 0;


    container.innerHTML = "";


    cart.forEach(function(item,index){

        const price =
            getPrice(item.price);

        const quantity =
            Number(item.quantity) || 1;

        subtotal +=
            price * quantity;


        const image =
            item.image ||
            "mainstream-logo.png";


        container.innerHTML += `

            <div class="cart-item">

                <img
                    src="${image}"
                    alt="${item.name || "Product"}"
                >

                <div class="item-details">

                    <div class="item-name">
                        ${item.name || "MAINSTREAM TEE"}
                    </div>

                    <div class="item-info">
                        Size: ${item.size || "M"}
                    </div>

                    <div class="item-info">
                        Quantity: ${quantity}
                    </div>

                    <div class="item-price">
                        ₹${price.toLocaleString("en-IN")}
                    </div>

                    <button
                        class="remove-btn"
                        onclick="removeItem(${index})"
                    >
                        REMOVE
                    </button>

                </div>

            </div>

        `;

    });


    summary.innerHTML = `

        <div class="cart-summary">

            <div class="summary-row">

                <span>Subtotal</span>

                <span>
                    ₹${subtotal.toLocaleString("en-IN")}
                </span>

            </div>


            <div class="summary-row">

                <span>Shipping</span>

                <span>FREE</span>

            </div>


            <div class="summary-row total">

                <span>Total</span>

                <span>
                    ₹${subtotal.toLocaleString("en-IN")}
                </span>

            </div>


            <button
                class="checkout-btn"
                onclick="checkout()"
            >
                PROCEED TO CHECKOUT
            </button>

        </div>

    `;
}


function removeItem(index){

    cart.splice(index,1);

    localStorage.setItem(
        "mainstreamCart",
        JSON.stringify(cart)
    );

    renderCart();

}


function checkout(){

    if(cart.length === 0){

        alert("Your cart is empty.");

        return;
    }

    alert(
        "Checkout will be available soon."
    );

}


renderCart();

</script>

</body>
</html>
