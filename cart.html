<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cart | MAINSTREAM™</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f7f5ef;
    color:#111;
}

/* HEADER */

header{
    height:80px;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
}

.logo{
    height:42px;
    width:auto;
}

.nav{
    display:flex;
    align-items:center;
    gap:28px;
}

.nav a{
    color:white;
    text-decoration:none;
    font-size:13px;
    letter-spacing:1px;
}

.cart-link{
    color:#f5d547 !important;
}

/* TITLE */

.cart-title{
    text-align:center;
    padding:55px 20px 30px;
}

.cart-title h1{
    font-size:32px;
    letter-spacing:3px;
}

.cart-title p{
    margin-top:10px;
    color:#777;
    font-size:13px;
}

/* CART */

.cart-container{
    width:90%;
    max-width:1100px;
    margin:auto;
    padding-bottom:70px;
}

.cart-item{
    background:white;
    border:1px solid #ddd;
    display:flex;
    align-items:center;
    gap:25px;
    padding:20px;
    margin-bottom:15px;
}

.cart-item-image{
    width:120px;
    height:140px;
    background:#f3f3f3;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.cart-item-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.cart-item-info{
    flex:1;
}

.cart-item-info h3{
    font-size:17px;
    letter-spacing:1px;
    margin-bottom:8px;
}

.cart-item-info p{
    font-size:13px;
    color:#666;
    margin:5px 0;
}

.cart-item-price{
    font-size:18px;
    font-weight:bold;
    margin-right:20px;
}

.remove-btn{
    border:none;
    background:#111;
    color:white;
    padding:10px 15px;
    cursor:pointer;
    font-size:11px;
    letter-spacing:1px;
}

.remove-btn:hover{
    background:#333;
}

/* SUMMARY */

.summary{
    background:white;
    border:1px solid #ddd;
    padding:25px;
    margin-top:30px;
    max-width:500px;
    margin-left:auto;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    font-size:14px;
}

.summary-total{
    border-top:1px solid #ddd;
    margin-top:10px;
    padding-top:18px;
    font-size:20px;
    font-weight:bold;
}

.checkout-btn{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:none;
    background:#f5d547;
    color:#111;
    font-weight:bold;
    letter-spacing:1.5px;
    cursor:pointer;
}

.checkout-btn:hover{
    background:#e4c632;
}

/* EMPTY CART */

.empty-cart{
    text-align:center;
    padding:80px 20px;
    background:white;
    border:1px solid #ddd;
}

.empty-cart h2{
    font-size:22px;
    margin-bottom:10px;
}

.empty-cart p{
    color:#777;
    margin-bottom:25px;
}

.shop-btn{
    display:inline-block;
    background:#111;
    color:white;
    text-decoration:none;
    padding:14px 25px;
    font-size:12px;
    letter-spacing:1px;
}

/* MOBILE */

@media(max-width:600px){

    header{
        height:70px;
        padding:0 20px;
    }

    .logo{
        height:34px;
    }

    .nav{
        gap:15px;
    }

    .nav a{
        font-size:10px;
    }

    .cart-title{
        padding:40px 15px 25px;
    }

    .cart-title h1{
        font-size:25px;
    }

    .cart-item{
        gap:15px;
        padding:12px;
        align-items:flex-start;
    }

    .cart-item-image{
        width:85px;
        height:105px;
    }

    .cart-item-info h3{
        font-size:13px;
    }

    .cart-item-info p{
        font-size:11px;
    }

    .cart-item-price{
        font-size:14px;
        margin-right:0;
    }

    .remove-btn{
        padding:8px 10px;
        font-size:9px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

<a href="index.html">
<img
src="mainstream-logo.png"
class="logo"
alt="MAINSTREAM">
</a>

<nav class="nav">

<a href="index.html">HOME</a>

<a href="shop.html">SHOP</a>

<a href="cart.html"
class="cart-link">
CART <span id="cartCount">0</span>
</a>

</nav>

</header>


<!-- TITLE -->

<section class="cart-title">

<h1>YOUR CART</h1>

<p>Review your selected products</p>

</section>


<!-- CART -->

<main class="cart-container">

<div id="cartItems"></div>


<!-- SUMMARY -->

<div
class="summary"
id="cartSummary"
style="display:none;">

<div class="summary-row">

<span>SUBTOTAL</span>

<span id="subtotal">₹0</span>

</div>


<div class="summary-row">

<span>SHIPPING</span>

<span id="shipping">FREE</span>

</div>


<div class="summary-row summary-total">

<span>TOTAL</span>

<span id="total">₹0</span>

</div>


<button
class="checkout-btn"
onclick="checkout()">

PROCEED TO CHECKOUT

</button>

</div>


</main>


<script>

/* =========================
   CART
========================= */

function getCart(){

    try{

        return JSON.parse(
            localStorage.getItem("mainstreamCart")
        ) || [];

    }catch(error){

        return [];

    }

}


/* =========================
   SAVE CART
========================= */

function saveCart(cart){

    localStorage.setItem(
        "mainstreamCart",
        JSON.stringify(cart)
    );

}


/* =========================
   UPDATE CART COUNT
========================= */

function updateCartCount(){

    const cart = getCart();

    const count = cart.reduce(
        function(total,item){

            return total +
                Number(item.quantity || 0);

        },
        0
    );


    const cartCount =
        document.getElementById("cartCount");


    if(cartCount){

        cartCount.textContent = count;

    }

}


/* =========================
   FORMAT PRICE
========================= */

function getPrice(price){

    if(typeof price === "number"){

        return price;

    }

    if(typeof price === "string"){

        return Number(
            price
            .replace("₹","")
            .replace(/,/g,"")
            .trim()
        ) || 0;

    }

    return 0;

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

    const cart = getCart();

    const container =
        document.getElementById("cartItems");

    const summary =
        document.getElementById("cartSummary");


    container.innerHTML = "";


    /* EMPTY CART */

    if(cart.length === 0){

        summary.style.display = "none";


        container.innerHTML = `

        <div class="empty-cart">

            <h2>Your cart is empty</h2>

            <p>
            Add some products to your cart.
            </p>

            <a
            href="shop.html"
            class="shop-btn">

            CONTINUE SHOPPING

            </a>

        </div>

        `;

        updateCartCount();

        return;

    }


    let subtotal = 0;


    /* PRODUCTS */

    cart.forEach(function(item,index){

        const quantity =
            Number(item.quantity || 1);


        const price =
            getPrice(item.price);


        const itemTotal =
            price * quantity;


        subtotal += itemTotal;


        const itemDiv =
            document.createElement("div");


        itemDiv.className =
            "cart-item";


        itemDiv.innerHTML = `

            <div class="cart-item-image">

                <img
                src="${item.image || 'mainstream-logo.png'}"
                alt="${item.name || 'Product'}"
                onerror="this.src='mainstream-logo.png'">

            </div>


            <div class="cart-item-info">

                <h3>
                ${item.name || "PRODUCT"}
                </h3>

                <p>
                SIZE:
                ${item.size || "M"}
                </p>

                <p>
                QUANTITY:
                ${quantity}
                </p>

                <p>
                UNIT PRICE:
                ₹${price.toLocaleString("en-IN")}
                </p>

            </div>


            <div class="cart-item-price">

                ₹${itemTotal.toLocaleString("en-IN")}

            </div>


            <button
            class="remove-btn"
            onclick="removeItem(${index})">

            REMOVE

            </button>

        `;


        container.appendChild(itemDiv);

    });


    /* SUMMARY */

    summary.style.display = "block";


    document.getElementById("subtotal")
        .textContent =
        "₹" +
        subtotal.toLocaleString("en-IN");


    document.getElementById("total")
        .textContent =
        "₹" +
        subtotal.toLocaleString("en-IN");


    updateCartCount();

}


/* =========================
   REMOVE ITEM
========================= */

function removeItem(index){

    const cart = getCart();


    if(index < 0 || index >= cart.length){

        return;

    }


    cart.splice(index,1);


    saveCart(cart);


    renderCart();

}


/* =========================
   CHECKOUT
========================= */

function checkout(){

    const cart = getCart();


    if(cart.length === 0){

        alert("Your cart is empty.");

        return;

    }


    alert(
        "Checkout is coming soon."
    );

}


/* =========================
   START
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        renderCart();

    }
);

</script>


</body>

</html>
