<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | MAINSTREAM™</title>

<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    color:#111;
}

/* HEADER */
.header{
    height:70px;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    width:150px;
    height:auto;
}

.admin-title{
    color:#fff;
    font-size:14px;
    letter-spacing:2px;
    font-weight:bold;
}

/* LAYOUT */
.layout{
    display:flex;
    min-height:calc(100vh - 70px);
}

/* SIDEBAR */
.sidebar{
    width:230px;
    background:#111;
    padding:25px 15px;
}

.sidebar h3{
    color:#f5c400;
    font-size:12px;
    letter-spacing:2px;
    margin:0 15px 20px;
}

.sidebar a{
    display:block;
    color:#aaa;
    text-decoration:none;
    padding:14px 15px;
    margin-bottom:5px;
    font-size:14px;
    border-radius:6px;
}

.sidebar a:hover,
.sidebar a.active{
    background:#f5c400;
    color:#111;
}

/* CONTENT */
.content{
    flex:1;
    padding:30px;
}

.page-title{
    font-size:28px;
    font-weight:800;
    margin-bottom:8px;
}

.subtitle{
    color:#777;
    margin-bottom:30px;
}

/* CARDS */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:30px;
}

.card{
    background:#fff;
    padding:25px;
    border-radius:12px;
    border:1px solid #e5e5e5;
}

.card-label{
    color:#777;
    font-size:12px;
    letter-spacing:1px;
    margin-bottom:12px;
}

.card-value{
    font-size:28px;
    font-weight:800;
}

/* TABLE */
.section{
    background:#fff;
    border-radius:12px;
    padding:25px;
    border:1px solid #e5e5e5;
}

.section-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    text-align:left;
    padding:14px 10px;
    border-bottom:1px solid #eee;
    font-size:14px;
}

th{
    font-size:11px;
    letter-spacing:1px;
    color:#777;
}

/* STATUS */
.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    background:#e8f7e8;
    color:#247024;
    font-size:11px;
    font-weight:bold;
}

/* MOBILE */
@media(max-width:800px){

    .header{
        padding:0 18px;
    }

    .logo{
        width:120px;
    }

    .admin-title{
        font-size:10px;
    }

    .sidebar{
        width:70px;
        padding:20px 8px;
    }

    .sidebar h3{
        display:none;
    }

    .sidebar a{
        text-align:center;
        font-size:0;
        padding:15px 5px;
    }

    .sidebar a::first-letter{
        font-size:18px;
    }

    .content{
        padding:20px 15px;
    }

    .page-title{
        font-size:24px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .card{
        padding:18px;
    }

    .card-value{
        font-size:22px;
    }

    .section{
        padding:18px;
        overflow-x:auto;
    }

    table{
        min-width:600px;
    }
}
</style>
</head>

<body>

<header class="header">

    <img
        src="mainstream-logo.png"
        class="logo"
        alt="MAINSTREAM">

    <div class="admin-title">
        ADMIN DASHBOARD
    </div>

</header>


<div class="layout">

    <aside class="sidebar">

        <h3>MAIN MENU</h3>

        <a href="#" class="active">📊 Dashboard</a>
        <a href="#">📦 Orders</a>
        <a href="#">👕 Products</a>
        <a href="#">📋 Inventory</a>
        <a href="#">👥 Customers</a>
        <a href="#">📈 Sales</a>
        <a href="#">⚙️ Settings</a>

    </aside>


    <main class="content">

        <h1 class="page-title">
            Dashboard
        </h1>

        <p class="subtitle">
            Welcome to your MAINSTREAM™ store admin panel.
        </p>


        <div class="stats">

            <div class="card">
                <div class="card-label">
                    TOTAL ORDERS
                </div>
                <div class="card-value">
                    0
                </div>
            </div>

            <div class="card">
                <div class="card-label">
                    TOTAL SALES
                </div>
                <div class="card-value">
                    ₹0
                </div>
            </div>

            <div class="card">
                <div class="card-label">
                    PRODUCTS
                </div>
                <div class="card-value">
                    7
                </div>
            </div>

            <div class="card">
                <div class="card-label">
                    CUSTOMERS
                </div>
                <div class="card-value">
                    0
                </div>
            </div>

        </div>


        <div class="section">

            <div class="section-title">
                Recent Orders
            </div>

            <table>

                <thead>
                    <tr>
                        <th>ORDER</th>
                        <th>PRODUCT</th>
                        <th>SIZE</th>
                        <th>AMOUNT</th>
                        <th>STATUS</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>—</td>
                        <td>No orders yet</td>
                        <td>—</td>
                        <td>₹0</td>
                        <td>
                            <span class="status">
                                WAITING
                            </span>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

</body>
</html>
