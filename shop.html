<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Shop — MAINSTREAM™</title>

<link rel="stylesheet" href="./style.css">

<style>

body{
  background:#f4f4f1;
}

.shop-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 5%;
  background:#fff;
  border-bottom:1px solid #ddd;
}

.shop-logo{
  width:190px;
  max-width:45vw;
  height:auto;
}

.shop-nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.shop-nav a{
  text-decoration:none;
  color:#070707;
  font-weight:600;
  font-size:13px;
  letter-spacing:1px;
}

.shop-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.search-icon,
.cart-btn{
  border:0;
  background:transparent;
  cursor:pointer;
  font-weight:700;
  padding:10px;
}

.search-icon{
  font-size:20px;
}

.cart-btn{
  background:#070707;
  color:#fff;
  padding:12px 16px;
}

.collection{
  padding:55px 5%;
}

.collection-top{
  margin-bottom:35px;
}

.eyebrow{
  font-size:12px;
  letter-spacing:4px;
  font-weight:700;
  margin-bottom:12px;
}

.collection h1{
  font-size:clamp(45px,8vw,90px);
  line-height:.85;
  margin:0 0 20px;
  font-weight:900;
  letter-spacing:-4px;
}

.collection-description{
  max-width:600px;
  font-size:17px;
  line-height:1.6;
}

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:30px 0;
}

.filter-btn{
  border:1px solid #111;
  background:#fff;
  padding:11px 18px;
  cursor:pointer;
  font-weight:700;
  letter-spacing:1px;
}

.filter-btn.active,
.filter-btn:hover{
  background:#070707;
  color:#fff;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

.product{
  background:#fff;
  padding-bottom:20px;
}

.product-image{
  background:#eee;
  overflow:hidden;
  aspect-ratio:1/1;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .4s ease;
}

.product:hover .product-image img{
  transform:scale(1.04);
}

.product-info{
  padding:18px;
}

.product-info h3{
  margin:0 0 8px;
  font-size:17px;
  letter-spacing:1px;
}

.product-info strong{
  font-size:17px;
}

.product-info p{
  font-size:11px;
  letter-spacing:2px;
  margin:8px 0 0;
  color:#666;
}

.product-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.product-actions button{
  flex:1;
  border:0;
  padding:13px 8px;
  cursor:pointer;
  font-size:11px;
  font-weight:800;
  letter-spacing:1px;
}

.view-product{
  background:#eee;
  color:#111;
}

.add{
  background:#ffe000;
  color:#111;
}

.cart{
  position:fixed;
  top:0;
  right:-420px;
  width:min(420px,90vw);
  height:100vh;
  background:#fff;
  z-index:1000;
  padding:25px;
  overflow-y:auto;
  transition:right .35s ease;
  box-shadow:-10px 0 30px rgba(0,0,0,.15);
}

.cart.open{
  right:0;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
  padding-bottom:15px;
}

.cart-header h2{
  margin:0;
  font-size:25px;
}

.close-cart{
  border:0;
  background:none;
  font-size:25px;
  cursor:pointer;
}

.cart-item{
  display:flex;
  gap:15px;
  padding:18px 0;
  border-bottom:1px solid #ddd;
}

.cart-item img{
  width:80px;
  height:80px;
  object-fit:cover;
}

.cart-item strong{
  display:block;
  margin-bottom:6px;
}

.quantity-controls{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:10px;
}

.quantity-controls button{
  width:28px;
  height:28px;
  border:1px solid #111;
  background:#fff;
  cursor:pointer;
}

.remove-item{
  border:0;
  background:none;
  padding:0;
  margin-top:8px;
  font-size:10px;
  text-decoration:underline;
  cursor:pointer;
}

.cart-footer{
  margin-top:25px;
  border-top:1px solid #111;
  padding-top:20px;
}

.cart-total{
  display:flex;
  justify-content:space-between;
  font-weight:800;
  font-size:18px;
  margin-bottom:20px;
}

.checkout{
  width:100%;
  border:0;
  background:#ffe000;
  padding:17px;
  font-weight:900;
  cursor:pointer;
  letter-spacing:1px;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:900;
  display:none;
}

.overlay.show{
  display:block;
}

@media(max-width:800px){

  .shop-header{
    padding:15px 20px;
  }

  .shop-nav{
    display:none;
  }

  .shop-logo{
    width:170px;
  }

  .collection{
    padding:40px 20px;
  }

  .product-grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .product-info{
    padding:12px;
  }

  .product-info h3{
    font-size:13px;
  }

  .product-actions{
    flex-direction:column;
  }

  .product-actions button{
    width:100%;
  }

}

@media(max-width:480px){

  .product-grid{
    grid-template-columns:1fr 1fr;
  }

  .collection h1{
    letter-spacing:-2px;
  }

  .collection-description{
    font-size:14px;
  }

}

</style>

</head>

<body>

<header class="shop-header">

  <a href="index.html">
    <img
      src="mainstream-logo.png"
      alt="MAINSTREAM"
      class="shop-logo"
    >
  </a>

  <nav class="shop-nav">
    <a href="index.html">HOME</a>
    <a href="shop.html">SHOP</a>
    <a href="index.html#story">OUR STORY</a>
    <a href="index.html#contact">CONTACT</a>
  </nav>

  <div class="shop-actions">

    <button
      class="search-icon"
      onclick="searchProducts()"
      aria-label="Search"
    >
      🔍
    </button>

    <button
      class="cart-btn"
      onclick="openCart()"
    >
      CART <span id="cartCount">0</span>
    </button>

  </div>

</header>


<main class="collection">

  <div class="collection-top">

    <div class="eyebrow">
      MAINSTREAM™ / COLLECTION
    </div>

    <h1>
      THE<br>
      COLLECTION
    </h1>

    <p class="collection-description">
      Elevated essentials, designed for everyday distinction.
    </p>

  </div>


  <div class="filters">

    <button
      class="filter-btn active"
      onclick="filterProducts('ALL', this)"
    >
      ALL
    </button>

    <button
      class="filter-btn"
      onclick="filterProducts('T-SHIRTS', this)"
    >
      T-SHIRTS
    </button>

  </div>


  <section
    class="product-grid"
    id="products"
  ></section>

</main>


<aside
  class="cart"
  id="cart"
>

  <div class="cart-header">

    <h2>YOUR BAG</h2>

    <button
      class="close-cart"
      onclick="closeCart()"
    >
      ×
    </button>

  </div>


  <div id="cartItems"></div>


  <div class="cart-footer">

    <div class="cart-total">

      <span>SUBTOTAL</span>

      <span id="cartTotal">
        ₹0
      </span>

    </div>

    <button
      class="checkout"
      onclick="checkout()"
    >
      PROCEED TO CHECKOUT
    </button>

  </div>

</aside>


<div
  class="overlay"
  id="overlay"
  onclick="closeCart()"
></div>


<script src="./script.js"></script>


<script>

function filterProducts(category, button){

  document
    .querySelectorAll(".filter-btn")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  if(category === "ALL"){
    renderProducts();
  }else{

    const filtered = products.filter(
      product => product.category === category
    );

    renderProducts(filtered);

  }

}

</script>

</body>
</html>
