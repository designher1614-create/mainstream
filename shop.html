<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Shop — MAINSTREAM™</title>

<link rel="stylesheet" href="./style.css">

<style>

/* SEARCH ICON */

.search-icon{
  border:0;
  background:transparent;
  font-size:18px;
  cursor:pointer;
  padding:10px;
}


/* PRODUCT BUTTONS */

.product-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.product-actions button{
  flex:1;
}

.view-product{
  background:#111;
  color:#fff;
  border:0;
  padding:12px 8px;
  cursor:pointer;
  font-size:11px;
  font-weight:bold;
}

.add{
  cursor:pointer;
}


/* NO RESULTS */

.no-results{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  font-size:15px;
}

</style>

</head>


<body>


<!-- HEADER -->

<header class="nav">

  <a class="brand" href="index.html">

    <img
      src="mainstream-logo.png"
      alt="MAINSTREAM™">

  </a>


  <nav>

    <a href="index.html">
      HOME
    </a>

    <a
      class="active"
      href="shop.html">
      SHOP
    </a>

    <a href="index.html#new">
      NEW ARRIVALS
    </a>

    <a href="index.html#story">
      ABOUT
    </a>

    <a href="index.html#contact">
      CONTACT
    </a>

  </nav>


  <!-- SEARCH -->

  <button
    class="search-icon"
    onclick="searchProducts()"
    aria-label="Search">

    🔍

  </button>


  <!-- CART -->

  <button
    class="cart-btn"
    onclick="openCart()">

    CART

    <span id="cartCount">
      0
    </span>

  </button>

</header>



<!-- SHOP PAGE -->

<main class="shop-page">


  <div class="shop-head">

    <p class="eyebrow">
      MAINSTREAM™ / COLLECTION
    </p>

    <h1>
      THE COLLECTION
    </h1>

    <p>
      Elevated essentials, designed for everyday distinction.
    </p>

  </div>



  <!-- FILTERS -->

  <div class="filters">

    <button
      class="filter active"
      data-filter="all">

      ALL

    </button>


    <button
      class="filter"
      data-filter="tees">

      TEES

    </button>


    <button
      class="filter"
      data-filter="hoodies">

      HOODIES

    </button>


    <button
      class="filter"
      data-filter="outerwear">

      OUTERWEAR

    </button>

  </div>



  <!-- PRODUCTS -->

  <section
    class="product-grid"
    id="products">

  </section>


</main>



<!-- CART -->

<aside
  class="cart"
  id="cart">


  <div class="cart-head">

    <h2>
      YOUR BAG
    </h2>


    <button
      onclick="closeCart()">

      ×

    </button>

  </div>


  <div id="cartItems"></div>


  <div class="cart-foot">

    <div>

      <span>
        Subtotal
      </span>

      <strong id="subtotal">
        ₹0
      </strong>

    </div>


    <button
      class="checkout"
      onclick="checkout()">

      PROCEED TO CHECKOUT

    </button>

  </div>


</aside>



<!-- OVERLAY -->

<div
  class="overlay"
  id="overlay"
  onclick="closeCart()">
</div>



<!-- MAIN SCRIPT -->

<script src="script.js"></script>


<script>


/* SEARCH FUNCTION */

function searchProducts(){

  const search =
    prompt(
      "SEARCH MAINSTREAM™ PRODUCTS:"
    );


  if(search === null){
    return;
  }


  const text =
    search
      .toLowerCase()
      .trim();


  const cards =
    document.querySelectorAll(
      ".product"
    );


  let found = 0;


  cards.forEach(card => {

    const name =
      card
        .querySelector("h3")
        ?.textContent
        .toLowerCase() || "";


    if(
      text === "" ||
      name.includes(text)
    ){

      card.style.display = "";

      found++;

    }else{

      card.style.display = "none";

    }

  });


  let message =
    document.getElementById(
      "noResults"
    );


  if(found === 0){

    if(!message){

      message =
        document.createElement(
          "div"
        );


      message.id =
        "noResults";


      message.className =
        "no-results";


      message.textContent =
        "No products found.";


      document
        .getElementById("products")
        .appendChild(message);

    }

  }else{

    if(message){
      message.remove();
    }

  }

}



/* FILTERS */

document
  .querySelectorAll(".filter")
  .forEach(button => {

    button.addEventListener(
      "click",
      function(){

        document
          .querySelectorAll(".filter")
          .forEach(btn => {

            btn.classList.remove(
              "active"
            );

          });


        this.classList.add(
          "active"
        );


        const filter =
          this.dataset.filter;


        document
          .querySelectorAll(".product")
          .forEach(card => {

            const category =
              card.dataset.category ||
              "tees";


            if(
              filter === "all" ||
              category === filter
            ){

              card.style.display = "";

            }else{

              card.style.display =
                "none";

            }

          });

      }
    );

  });


</script>


</body>
</html>
