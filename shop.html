<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop — MAINSTREAM™</title>

<link rel="stylesheet" href="style.css">

<style>
.search-area{
  display:flex;
  justify-content:center;
  margin:25px auto 10px;
  max-width:600px;
  padding:0 20px;
}

.search-box{
  display:flex;
  width:100%;
  background:#fff;
  border:1px solid #111;
}

.search-box input{
  flex:1;
  border:0;
  outline:0;
  padding:15px;
  font-size:14px;
  background:#fff;
}

.search-box button{
  width:55px;
  border:0;
  background:#ffd21c;
  font-size:22px;
  cursor:pointer;
}

.no-results{
  text-align:center;
  padding:60px 20px;
  font-size:16px;
}
</style>
</head>

<body>

<header class="nav">

  <a class="brand" href="index.html">
    <img src="mainstream-logo.png" alt="MAINSTREAM™">
  </a>

  <nav>
    <a href="index.html">HOME</a>
    <a class="active" href="shop.html">SHOP</a>
    <a href="index.html#new">NEW ARRIVALS</a>
    <a href="index.html#story">ABOUT</a>
    <a href="index.html#contact">CONTACT</a>
  </nav>

  <button class="cart-btn" onclick="openCart()">
    CART <span id="cartCount">0</span>
  </button>

</header>


<main class="shop-page">

  <div class="shop-head">

    <p class="eyebrow">
      MAINSTREAM™ / COLLECTION
    </p>

    <h1>
      THE COLLECTION
    </h1>

    <p>
      Elevated essentials, designed for everyday distinction.
    </p>

  </div>


  <!-- SEARCH -->

  <div class="search-area">

    <div class="search-box">

      <input
        type="search"
        id="searchInput"
        placeholder="Search dresses, tees, hoodies..."
        autocomplete="off"
      >

      <button onclick="searchProducts()">
        🔍
      </button>

    </div>

  </div>


  <!-- FILTERS -->

  <div class="filters">

    <button class="filter active" data-filter="all">
      ALL
    </button>

    <button class="filter" data-filter="tees">
      TEES
    </button>

    <button class="filter" data-filter="hoodies">
      HOODIES
    </button>

    <button class="filter" data-filter="outerwear">
      OUTERWEAR
    </button>

  </div>


  <!-- PRODUCTS -->

  <section
    class="product-grid"
    id="products">
  </section>

</main>


<!-- CART -->

<aside class="cart" id="cart">

  <div class="cart-head">

    <h2>
      YOUR BAG
    </h2>

    <button onclick="closeCart()">
      ×
    </button>

  </div>

  <div id="cartItems"></div>

  <div class="cart-foot">

    <div>

      <span>
        Subtotal
      </span>

      <strong id="subtotal">
        ₹0
      </strong>

    </div>

    <button
      class="checkout"
      onclick="checkout()">
      PROCEED TO CHECKOUT
    </button>

  </div>

</aside>


<div
  class="overlay"
  id="overlay"
  onclick="closeCart()">
</div>


<script src="script.js"></script>


<script>

/* SEARCH */

function searchProducts(){

  const input =
    document.getElementById("searchInput");

  const search =
    input.value.toLowerCase().trim();

  const productCards =
    document.querySelectorAll(".product");

  let found = 0;


  productCards.forEach(card => {

    const name =
      card.querySelector("h3")
        ?.textContent
        .toLowerCase() || "";

    if(
      search === "" ||
      name.includes(search)
    ){

      card.style.display = "";

      found++;

    }else{

      card.style.display = "none";

    }

  });


  let message =
    document.getElementById("noResults");


  if(found === 0){

    if(!message){

      message =
        document.createElement("div");

      message.id = "noResults";

      message.className =
        "no-results";

      message.textContent =
        "No products found.";

      document
        .getElementById("products")
        .appendChild(message);

    }

  }else{

    if(message){
      message.remove();
    }

  }

}


/* SEARCH WHILE TYPING */

document
  .getElementById("searchInput")
  .addEventListener("input", searchProducts);


/* ENTER KEY */

document
  .getElementById("searchInput")
  .addEventListener("keydown",function(event){

    if(event.key === "Enter"){
      searchProducts();
    }

  });

</script>

</body>
</html>
