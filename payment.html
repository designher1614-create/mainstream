<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Payment — MAINSTREAM™</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f4f1;
  color:#070707;
}

.header{
  background:#fff;
  padding:20px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
}

.logo{
  width:190px;
  max-width:45vw;
}

.back{
  color:#070707;
  text-decoration:none;
  font-weight:bold;
  font-size:12px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:55px 5%;
}

.steps{
  font-size:11px;
  font-weight:bold;
  letter-spacing:3px;
  margin-bottom:20px;
}

h1{
  font-size:70px;
  letter-spacing:-4px;
  margin-bottom:45px;
}

.layout{
  display:grid;
  grid-template-columns:1.4fr .8fr;
  gap:40px;
}

.box{
  background:#fff;
  padding:30px;
}

h2{
  font-size:22px;
  margin-bottom:25px;
}

.option{
  border:1px solid #ccc;
  padding:20px;
  margin-bottom:15px;
}

.option label{
  display:flex;
  align-items:center;
  gap:15px;
  font-weight:bold;
  cursor:pointer;
}

.option input{
  width:20px;
  height:20px;
}

.card-details{
  display:none;
  background:#f4f4f1;
  padding:20px;
  margin-bottom:15px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-size:11px;
  font-weight:bold;
  margin-bottom:7px;
}

input[type="text"],
input[type="number"]{
  width:100%;
  padding:14px;
  border:1px solid #bbb;
  font-size:15px;
}

.place{
  width:100%;
  padding:19px;
  margin-top:10px;
  border:0;
  background:#ffe000;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
}

.item{
  display:flex;
  justify-content:space-between;
  padding:14px 0;
  border-bottom:1px solid #ddd;
  font-size:13px;
}

.total{
  display:flex;
  justify-content:space-between;
  border-top:1px solid #000;
  margin-top:15px;
  padding-top:20px;
  font-size:20px;
  font-weight:bold;
}

.note{
  margin-top:25px;
  padding:15px;
  background:#f4f4f1;
  font-size:12px;
  line-height:1.5;
}

@media(max-width:800px){
  .layout{
    grid-template-columns:1fr;
  }

  h1{
    font-size:58px;
  }
}
</style>
</head>

<body>

<header class="header">

  <a href="index.html">
    <img src="mainstream-logo.png" class="logo" alt="MAINSTREAM™">
  </a>

  <a href="shipping.html" class="back">
    ← BACK TO SHIPPING
  </a>

</header>

<main class="container">

  <div class="steps">
    01 CART / 02 SHIPPING / 03 PAYMENT
  </div>

  <h1>PAYMENT</h1>

  <div class="layout">

    <section class="box">

      <h2>CHOOSE PAYMENT METHOD</h2>

      <form id="paymentForm">

        <div class="option">
          <label>
            <input type="radio" name="method" value="card">
            CREDIT / DEBIT CARD
          </label>
        </div>

        <div id="cardDetails" class="card-details">

          <div class="field">
            <label>CARD NUMBER</label>
            <input type="text" placeholder="1234 5678 9012 3456">
          </div>

          <div class="field">
            <label>EXPIRY DATE</label>
            <input type="text" placeholder="MM/YY">
          </div>

          <div class="field">
            <label>CVV</label>
            <input type="number" placeholder="123">
          </div>

        </div>

        <div class="option">
          <label>
            <input type="radio" name="method" value="upi">
            <span>
              UPI
              <small style="display:block;color:#777;margin-top:5px;">
                Google Pay • PhonePe • Paytm
              </small>
            </span>
          </label>
        </div>

        <div class="option">
          <label>
            <input type="radio" name="method" value="cod">
            <span>
              CASH ON DELIVERY
              <small style="display:block;color:#777;margin-top:5px;">
                Pay when your order arrives
              </small>
            </span>
          </label>
        </div>

        <button type="submit" class="place">
          PLACE ORDER →
        </button>

      </form>

      <div class="note">
        🔒 Your payment information is protected.
        This is a demo checkout and does not process real payments.
      </div>

    </section>


    <aside class="box">

      <h2>ORDER SUMMARY</h2>

      <div id="items"></div>

      <div class="item">
        <span>Shipping</span>
        <strong>₹0</strong>
      </div>

      <div class="total">
        <span>TOTAL</span>
        <strong id="total">₹0</strong>
      </div>

    </aside>

  </div>

</main>


<script>

const cart =
  JSON.parse(localStorage.getItem("mainstreamCart")) || [];

const items =
  document.getElementById("items");

const totalElement =
  document.getElementById("total");

let total = 0;


if(cart.length === 0){

  items.innerHTML =
    "<p>Your cart is empty.</p>";

}else{

  cart.forEach(item => {

    const price =
      Number(
        String(item.price)
        .replace(/[₹,]/g,"")
      ) || 0;

    const quantity =
      Number(item.quantity) || 1;

    const amount =
      price * quantity;

    total += amount;

    items.innerHTML += `
      <div class="item">
        <span>${item.name} × ${quantity}</span>
        <strong>₹${amount.toLocaleString("en-IN")}</strong>
      </div>
    `;

  });

}


totalElement.textContent =
  "₹" + total.toLocaleString("en-IN");


/* CARD DETAILS */

document
.querySelectorAll('input[name="method"]')
.forEach(function(option){

  option.addEventListener("change",function(){

    document.getElementById("cardDetails").style.display =
      this.value === "card" ? "block" : "none";

  });

});


/* PLACE ORDER */

document
.getElementById("paymentForm")
.addEventListener("submit",function(e){

  e.preventDefault();

  const selected =
    document.querySelector(
      'input[name="method"]:checked'
    );

  if(!selected){

    alert("Please select a payment method.");

    return;

  }

  localStorage.setItem(
    "mainstreamPayment",
    JSON.stringify({
      method:selected.value,
      total:total
    })
  );

  window.location.href =
    "confirmation.html";

});

</script>

</body>
</html>
