<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Payment — MAINSTREAM™</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f4f1;
  color:#070707;
}

.header{
  background:#fff;
  padding:20px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
}

.logo{
  width:190px;
  max-width:45vw;
}

.back{
  color:#070707;
  text-decoration:none;
  font-weight:bold;
  font-size:12px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:55px 5%;
}

.steps{
  font-size:11px;
  font-weight:bold;
  letter-spacing:3px;
  margin-bottom:20px;
}

h1{
  font-size:70px;
  letter-spacing:-4px;
  margin-bottom:45px;
}

.layout{
  display:grid;
  grid-template-columns:1.4fr .8fr;
  gap:40px;
}

.box{
  background:#fff;
  padding:30px;
}

h2{
  font-size:22px;
  margin-bottom:25px;
}

.option{
  border:1px solid #ccc;
  padding:20px;
  margin-bottom:15px;
}

.option label{
  display:flex;
  align-items:center;
  gap:15px;
  font-weight:bold;
  cursor:pointer;
}

.option input{
  width:20px;
  height:20px;
}

.subtext{
  display:block;
  color:#777;
  font-size:13px;
  margin-top:6px;
  font-weight:normal;
}

.card-details,
.upi-details{
  display:none;
  background:#f4f4f1;
  padding:20px;
  margin-bottom:15px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-size:11px;
  font-weight:bold;
  margin-bottom:7px;
}

input[type="text"],
input[type="number"]{
  width:100%;
  padding:14px;
  border:1px solid #bbb;
  font-size:15px;
}

.app-title{
  font-size:13px;
  font-weight:bold;
  margin-bottom:15px;
}

.apps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.app{
  background:#fff;
  border:1px solid #bbb;
  padding:16px 8px;
  text-align:center;
  cursor:pointer;
  font-weight:bold;
  font-size:12px;
}

.app.selected{
  border:3px solid #070707;
}

.app-icon{
  font-size:28px;
  display:block;
  margin-bottom:8px;
}

.pay-button{
  width:100%;
  padding:18px;
  margin-top:15px;
  border:0;
  background:#ffe000;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
}

.complete-button{
  display:none;
  width:100%;
  padding:18px;
  margin-top:15px;
  border:0;
  background:#070707;
  color:#fff;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
}

.item{
  display:flex;
  justify-content:space-between;
  padding:14px 0;
  border-bottom:1px solid #ddd;
  font-size:13px;
}

.total{
  display:flex;
  justify-content:space-between;
  border-top:1px solid #000;
  margin-top:15px;
  padding-top:20px;
  font-size:20px;
  font-weight:bold;
}

.note{
  margin-top:25px;
  padding:15px;
  background:#f4f4f1;
  font-size:12px;
  line-height:1.5;
}

@media(max-width:800px){

  .layout{
    grid-template-columns:1fr;
  }

  h1{
    font-size:58px;
  }

  .apps{
    grid-template-columns:1fr 1fr 1fr;
  }

}

</style>

</head>


<body>


<header class="header">

  <a href="index.html">

    <img
      src="mainstream-logo.png"
      class="logo"
      alt="MAINSTREAM™"
    >

  </a>

  <a href="shipping.html" class="back">
    ← BACK TO SHIPPING
  </a>

</header>


<main class="container">

  <div class="steps">
    01 CART / 02 SHIPPING / 03 PAYMENT
  </div>

  <h1>PAYMENT</h1>


  <div class="layout">


    <!-- PAYMENT BOX -->

    <section class="box">

      <h2>CHOOSE PAYMENT METHOD</h2>


      <form id="paymentForm">


        <!-- CARD -->

        <div class="option">

          <label>

            <input
              type="radio"
              name="method"
              value="card"
            >

            <span>
              CREDIT / DEBIT CARD
            </span>

          </label>

        </div>


        <!-- CARD DETAILS -->

        <div
          id="cardDetails"
          class="card-details"
        >

          <div class="field">

            <label>
              CARD NUMBER
            </label>

            <input
              type="text"
              placeholder="1234 5678 9012 3456"
            >

          </div>


          <div class="field">

            <label>
              EXPIRY DATE
            </label>

            <input
              type="text"
              placeholder="MM/YY"
            >

          </div>


          <div class="field">

            <label>
              CVV
            </label>

            <input
              type="number"
              placeholder="123"
            >

          </div>

        </div>


        <!-- UPI -->

        <div class="option">

          <label>

            <input
              type="radio"
              name="method"
              value="upi"
            >

            <span>

              UPI

              <small class="subtext">
                Google Pay • PhonePe • Paytm
              </small>

            </span>

          </label>

        </div>


        <!-- UPI APPS -->

        <div
          id="upiDetails"
          class="upi-details"
        >

          <div class="app-title">
            SELECT YOUR UPI APP
          </div>


          <div class="apps">


            <div
              class="app"
              data-app="Google Pay"
            >

              <span class="app-icon">🟢</span>

              Google Pay

            </div>


            <div
              class="app"
              data-app="PhonePe"
            >

              <span class="app-icon">🟣</span>

              PhonePe

            </div>


            <div
              class="app"
              data-app="Paytm"
            >

              <span class="app-icon">🔵</span>

              Paytm

            </div>


          </div>


          <button
            type="button"
            id="upiPayButton"
            class="pay-button"
          >
            PAY NOW →
          </button>


          <button
            type="button"
            id="completeButton"
            class="complete-button"
          >
            I HAVE COMPLETED PAYMENT →
          </button>

        </div>


        <!-- COD -->

        <div class="option">

          <label>

            <input
              type="radio"
              name="method"
              value="cod"
            >

            <span>

              CASH ON DELIVERY

              <small class="subtext">
                Pay when your order arrives
              </small>

            </span>

          </label>

        </div>


        <button
          type="submit"
          id="placeOrder"
          class="pay-button"
        >
          PLACE ORDER →
        </button>


      </form>


      <div class="note">

        🔒 Your payment information is protected.

        <br><br>

        UPI checkout on this demo website cannot
        automatically verify real payment status.

      </div>

    </section>


    <!-- ORDER SUMMARY -->

    <aside class="box">

      <h2>ORDER SUMMARY</h2>

      <div id="items"></div>


      <div class="item">

        <span>Shipping</span>

        <strong>₹0</strong>

      </div>


      <div class="total">

        <span>TOTAL</span>

        <strong id="total">
          ₹0
        </strong>

      </div>

    </aside>


  </div>

</main>


<script>


/* CART */

const cart =
  JSON.parse(
    localStorage.getItem("mainstreamCart")
  ) || [];


const items =
  document.getElementById("items");

const totalElement =
  document.getElementById("total");


let total = 0;


/* ORDER SUMMARY */

if(cart.length === 0){

  items.innerHTML =
    "<p>Your cart is empty.</p>";

}else{

  cart.forEach(item => {

    const price =
      Number(
        String(item.price)
        .replace(/[₹,]/g,"")
      ) || 0;

    const quantity =
      Number(item.quantity) || 1;

    const amount =
      price * quantity;

    total += amount;


    items.innerHTML += `

      <div class="item">

        <span>
          ${item.name} × ${quantity}
        </span>

        <strong>
          ₹${amount.toLocaleString("en-IN")}
        </strong>

      </div>

    `;

  });

}


totalElement.textContent =
  "₹" + total.toLocaleString("en-IN");


/* ELEMENTS */

const cardDetails =
  document.getElementById("cardDetails");

const upiDetails =
  document.getElementById("upiDetails");

const completeButton =
  document.getElementById("completeButton");

const placeOrder =
  document.getElementById("placeOrder");


let selectedApp = "";


/* PAYMENT METHOD */

document
.querySelectorAll('input[name="method"]')
.forEach(function(option){

  option.addEventListener("change",function(){

    cardDetails.style.display = "none";

    upiDetails.style.display = "none";

    completeButton.style.display = "none";

    placeOrder.style.display = "block";


    if(this.value === "card"){

      cardDetails.style.display = "block";

    }


    if(this.value === "upi"){

      upiDetails.style.display = "block";

      placeOrder.style.display = "none";

    }

  });

});


/* SELECT UPI APP */

document
.querySelectorAll(".app")
.forEach(function(app){

  app.addEventListener("click",function(){

    document
    .querySelectorAll(".app")
    .forEach(function(x){

      x.classList.remove("selected");

    });


    this.classList.add("selected");

    selectedApp =
      this.dataset.app;

  });

});


/* PAY NOW */

document
.getElementById("upiPayButton")
.addEventListener("click",function(){

  if(!selectedApp){

    alert(
      "Please select Google Pay, PhonePe or Paytm."
    );

    return;

  }


  /*
    Replace YOURUPI@BANK with your
    real business UPI ID when you have one.
  */

  const upiID =
    "YOURUPI@BANK";


  const upiURL =
    "upi://pay?pa="
    + encodeURIComponent(upiID)
    + "&pn="
    + encodeURIComponent("MAINSTREAM")
    + "&am="
    + total
    + "&cu=INR";


  window.location.href = upiURL;


  setTimeout(function(){

    completeButton.style.display =
      "block";

  },2000);

});


/* PAYMENT COMPLETED */

completeButton
.addEventListener("click",function(){

  localStorage.setItem(
    "mainstreamPayment",
    JSON.stringify({

      method:"upi",

      app:selectedApp,

      total:total,

      status:"customer_confirmed"

    })
  );


  window.location.href =
    "confirmation.html";

});


/* PLACE ORDER */

document
.getElementById("paymentForm")
.addEventListener("submit",function(e){

  e.preventDefault();


  const selected =
    document.querySelector(
      'input[name="method"]:checked'
    );


  if(!selected){

    alert(
      "Please select a payment method."
    );

    return;

  }


  if(selected.value === "upi"){

    return;

  }


  localStorage.setItem(
    "mainstreamPayment",
    JSON.stringify({

      method:selected.value,

      total:total,

      status:"confirmed"

    })
  );


  window.location.href =
    "confirmation.html";

});

</script>


</body>
</html>
