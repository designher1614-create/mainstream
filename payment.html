<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Payment — MAINSTREAM™</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f4f1;
  color:#070707;
}

.header{
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:20px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  width:190px;
  max-width:45vw;
}

.back{
  color:#070707;
  text-decoration:none;
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:60px 5%;
}

.steps{
  font-size:11px;
  font-weight:bold;
  letter-spacing:3px;
  margin-bottom:20px;
}

h1{
  font-size:clamp(45px,8vw,80px);
  line-height:.85;
  letter-spacing:-4px;
  margin-bottom:45px;
}

.layout{
  display:grid;
  grid-template-columns:1.4fr .8fr;
  gap:50px;
}

.payment-box,
.summary{
  background:#fff;
  padding:30px;
}

h2{
  font-size:22px;
  margin-bottom:30px;
  letter-spacing:1px;
}

.payment-option{
  border:1px solid #ccc;
  padding:20px;
  margin-bottom:15px;
  cursor:pointer;
}

.payment-option:hover{
  border-color:#070707;
}

.payment-option label{
  display:flex;
  align-items:center;
  gap:15px;
  cursor:pointer;
  font-weight:bold;
  font-size:16px;
}

.payment-option input{
  width:20px;
  height:20px;
}

.payment-details{
  margin-top:20px;
  padding:20px;
  background:#f4f4f1;
}

.field{
  margin-bottom:18px;
}

label{
  display:block;
  font-size:11px;
  font-weight:bold;
  letter-spacing:1px;
  margin-bottom:8px;
}

input[type="text"],
input[type="number"]{
  width:100%;
  padding:15px;
  border:1px solid #bbb;
  background:#fff;
  font-size:15px;
  outline:none;
}

input:focus{
  border:2px solid #070707;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.place-order{
  width:100%;
  margin-top:20px;
  padding:20px;
  border:0;
  background:#ffe000;
  color:#070707;
  font-size:15px;
  font-weight:900;
  letter-spacing:1px;
  cursor:pointer;
}

.place-order:active{
  transform:scale(.99);
}

.summary-item{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid #ddd;
  font-size:13px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  padding:16px 0;
}

.total{
  border-top:1px solid #070707;
  margin-top:10px;
  font-size:20px;
  font-weight:bold;
}

.note{
  margin-top:25px;
  padding:18px;
  background:#f4f4f1;
  font-size:13px;
  line-height:1.6;
}

@media(max-width:800px){

  .layout{
    grid-template-columns:1fr;
    gap:25px;
  }

  .payment-box,
  .summary{
    padding:22px;
  }

  .row{
    grid-template-columns:1fr;
  }

  h1{
    font-size:60px;
  }

}

</style>

</head>

<body>


<header class="header">

  <a href="index.html">

    <img
      src="mainstream-logo.png"
      class="logo"
      alt="MAINSTREAM™"
    >

  </a>

  <a href="shipping.html" class="back">
    ← BACK TO SHIPPING
  </a>

</header>


<main class="container">

  <div class="steps">
    01 CART &nbsp; / &nbsp; 02 SHIPPING &nbsp; / &nbsp; 03 PAYMENT
  </div>

  <h1>
    PAYMENT
  </h1>


  <div class="layout">


    <!-- PAYMENT -->

    <section class="payment-box">

      <h2>CHOOSE PAYMENT METHOD</h2>


      <form id="paymentForm">


        <!-- CARD -->

        <div class="payment-option">

          <label>

            <input
              type="radio"
              name="payment"
              value
