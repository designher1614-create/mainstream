<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MAINSTREAM™ — MAX / 03 TEE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f0;
    color:#111;
}

/* ================= HEADER ================= */

header{
    height:105px;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
}

.logo{
    font-size:27px;
    font-weight:900;
    letter-spacing:-2px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:18px;
}

.cart-button{
    background:#ffd900;
    color:#111;
    border:0;
    padding:18px 25px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

/* ================= BREADCRUMB ================= */

.breadcrumb{
    padding:45px 4%;
    color:#777;
    font-size:18px;
}

/* ================= PRODUCT AREA ================= */

.product-page{
    display:grid;
    grid-template-columns:58% 42%;
    gap:40px;
    padding:0 4% 80px;
}

/* ================= GALLERY ================= */

.gallery{
    display:grid;
    grid-template-columns:92px 1fr;
    gap:25px;
}

.thumbnails{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.thumbnail{
    width:92px;
    height:115px;
    background:#eee;
    border:1px solid #ddd;
    overflow:hidden;
    cursor:pointer;
    transition:.3s ease;
}

.thumbnail.active{
    border:3px solid #111;
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.main-image-area{
    background:#eee;
    min-height:700px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.main-image{
    width:100%;
    height:100%;
    max-height:700px;
    object-fit:contain;
    display:block;
    transition:
        opacity .35s ease,
        transform .45s ease;
}

.main-image.change{
    opacity:0;
    transform:scale(.96);
}

.rotate-label{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    background:#333;
    color:#fff;
    padding:16px 25px;
    border-radius:30px;
    font-size:15px;
    white-space:nowrap;
}

/* ================= PRODUCT INFO ================= */

.product-info{
    padding:10px 20px;
}

.product-name{
    font-size:48px;
    line-height:1.05;
    font-weight:900;
    margin-bottom:25px;
}

.product-price{
    font-size:32px;
    font-weight:700;
    margin-bottom:45px;
}

/* ================= COLOR ================= */

.option-title{
    font-size:17px;
    font-weight:800;
    margin-bottom:16px;
}

.color-options{
    display:flex;
    gap:14px;
    margin-bottom:35px;
}

.color-option{
    width:48px;
    height:48px;
    border-radius:50%;
    border:3px solid transparent;
    cursor:pointer;
    transition:.25s ease;
    position:relative;
}

.color-option.active{
    border:3px solid #111;
    transform:scale(1.08);
}

.color-black{
    background:#111;
}

.color-white{
    background:#fff;
    border:1px solid #999;
}

.color-beige{
    background:#e8dcc5;
}

.selected-color{
    font-size:14px;
    font-weight:700;
    margin-top:-22px;
    margin-bottom:35px;
}

/* ================= SIZE ================= */

.size-options{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:35px;
}

.size-option{
    min-width:58px;
    padding:16px 18px;
    background:#fff;
    border:2px solid #111;
    font-weight:800;
    cursor:pointer;
    transition:.25s ease;
}

.size-option.active{
    background:#111;
    color:#fff;
}

/* ================= QUANTITY ================= */

.quantity-title{
    font-size:17px;
    font-weight:800;
    margin-bottom:14px;
}

.quantity{
    display:flex;
    align-items:center;
    width:max-content;
    border:2px solid #111;
    margin-bottom:30px;
}

.quantity button{
    width:48px;
    height:48px;
    background:#fff;
    border:0;
    font-size:22px;
    cursor:pointer;
}

.quantity span{
    width:50px;
    text-align:center;
    font-size:17px;
    font-weight:700;
}

/* ================= BUTTONS ================= */

.add-cart,
.buy-now{
    width:100%;
    padding:20px;
    font-size:17px;
    font-weight:900;
    letter-spacing:1px;
    cursor:pointer;
    margin-bottom:14px;
    transition:.25s ease;
}

.add-cart{
    background:#ffd900;
    border:2px solid #111;
}

.buy-now{
    background:#111;
    color:#fff;
    border:2px solid #111;
}

.add-cart:hover,
.buy-now:hover{
    transform:translateY(-3px);
}

/* ================= DETAILS ================= */

.details{
    margin-top:35px;
    border-top:1px solid #ccc;
}

.detail-row{
    padding:20px 0;
    border-bottom:1px solid #ccc;
    font-size:15px;
    line-height:1.6;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

    header{
        height:85px;
        padding:0 5%;
    }

    .logo{
        font-size:21px;
    }

    .cart-button{
        padding:14px 18px;
        font-size:14px;
    }

    .breadcrumb{
        padding:30px 5%;
        font-size:16px;
    }

    .product-page{
        display:block;
        padding:0 5% 60px;
    }

    .gallery{
        grid-template-columns:70px 1fr;
        gap:12px;
    }

    .thumbnail{
        width:70px;
        height:88px;
    }

    .main-image-area{
        min-height:430px;
    }

    .main-image{
        max-height:430px;
    }

    .rotate-label{
        bottom:15px;
        padding:12px 18px;
        font-size:13px;
    }

    .product-info{
        padding:45px 0 0;
    }

    .product-name{
        font-size:36px;
    }

    .product-price{
        font-size:27px;
        margin-bottom:35px;
    }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        MAINSTREAM™
    </div>

    <div class="header-right">

        <button
            class="cart-button"
            onclick="goToCart()">

            CART <span id="cartCount">0</span>

        </button>

    </div>

</header>


<!-- ================= BREADCRUMB ================= -->

<div class="breadcrumb">

    Home → Shop → Product

</div>


<!-- ================= PRODUCT ================= -->

<main class="product-page">


<!-- ================= GALLERY ================= -->

<section class="gallery">


    <div class="thumbnails">


        <!-- 1 FRONT -->

        <div
            class="thumbnail active"
            onclick="changeImage(0)">

            <img
                src="max-front.png"
                alt="MAX Front">

        </div>


        <!-- 2 BACK -->

        <div
            class="thumbnail"
            onclick="changeImage(1)">

            <img
                src="max-back.png"
                alt="MAX Back">

        </div>


        <!-- 3 COMBINED -->

        <div
            class="thumbnail"
            onclick="changeImage(2)">

            <img
                src="max-combined.png"
                alt="MAX Product">

        </div>


        <!-- 4 SIZE CHART -->

        <div
            class="thumbnail"
            onclick="changeImage(3)">

            <img
                src="size-chart.png"
                alt="Size Chart">

        </div>


    </div>


    <div class="main-image-area">


        <img
            id="mainProductImage"
            class="main-image"
            src="max-front.png"
            alt="MAINSTREAM Product">


        <div class="rotate-label">
            ↔ DRAG TO ROTATE
        </div>


    </div>


</section>


<!-- ================= PRODUCT INFORMATION ================= -->

<section class="product-info">


    <h1 class="product-name">
        MAX / 03 TEE
    </h1>


    <div class="product-price">
        ₹999
    </div>


    <!-- ================= COLOR ================= -->

    <div class="option-title">
        COLOR
    </div>


    <div class="color-options">


        <button
            class="color-option color-black active"
            onclick="selectColor('Black',this)"
            aria-label="Black">
        </button>


        <button
            class="color-option color-white"
            onclick="selectColor('White',this)"
            aria-label="White">
        </button>


        <button
            class="color-option color-beige"
            onclick="selectColor('Beige',this)"
            aria-label="Beige">
        </button>


    </div>


    <div class="selected-color">

        Selected Colour:
        <span id="selectedColor">
            Black
        </span>

    </div>


    <!-- ================= SIZE ================= -->

    <div class="option-title">
        SIZE
    </div>


    <div class="size-options">


        <button
            class="size-option"
            onclick="selectSize('S',this)">
            S
        </button>


        <button
            class="size-option"
            onclick="selectSize('M',this)">
            M
        </button>


        <button
            class="size-option active"
            onclick="selectSize('L',this)">
            L
        </button>


        <button
            class="size-option"
            onclick="selectSize('XL',this)">
            XL
        </button>


        <button
            class="size-option"
            onclick="selectSize('XXL',this)">
            XXL
        </button>


    </div>


    <!-- ================= QUANTITY ================= -->

    <div class="quantity-title">
        QUANTITY
    </div>


    <div class="quantity">


        <button
            onclick="changeQuantity(-1)">
            −
        </button>


        <span id="quantity">
            1
        </span>


        <button
            onclick="changeQuantity(1)">
            +
        </button>


    </div>


    <!-- ================= BUTTONS ================= -->

    <button
        class="add-cart"
        onclick="addToCart()">

        ADD TO CART →

    </button>


    <button
        class="buy-now"
        onclick="buyNow()">

        BUY NOW →

    </button>


    <!-- ================= DETAILS ================= -->

    <div class="details">


        <div class="detail-row">

            <strong>PRODUCT</strong><br>

            Premium oversized T-shirt designed
            for everyday streetwear.

        </div>


        <div class="detail-row">

            <strong>FIT</strong><br>

            Oversized fit

        </div>


        <div class="detail-row">

            <strong>FABRIC</strong><br>

            Premium cotton

        </div>


        <div class="detail-row">

            <strong>CARE</strong><br>

            Machine wash cold.
            Do not bleach.
            Iron inside out.

        </div>


    </div>


</section>


</main>


<script>

/* ================= IMAGES ================= */

const productImages = [

    "max-front.png",

    "max-back.png",

    "max-combined.png",

    "size-chart.png"

];


let currentImage = 0;


function changeImage(index){

    const image =
        document.getElementById(
            "mainProductImage"
        );

    const thumbnails =
        document.querySelectorAll(
            ".thumbnail"
        );


    image.classList.add("change");


    setTimeout(function(){

        image.src =
            productImages[index];

        currentImage = index;

        image.onload = function(){

            image.classList.remove("change");

        };

    },180);


    thumbnails.forEach(function(item){

        item.classList.remove("active");

    });


    thumbnails[index]
        .classList.add("active");

}


/* ================= SWIPE / DRAG ================= */

let startX = 0;


const mainImage =
    document.getElementById(
        "mainProductImage"
    );


mainImage.addEventListener(
    "touchstart",
    function(e){

        startX =
            e.touches[0].clientX;

    },
    {passive:true}
);


mainImage.addEventListener(
    "touchend",
    function(e){

        const endX =
            e.changedTouches[0].clientX;

        const distance =
            endX - startX;


        if(Math.abs(distance) > 50){

            if(distance < 0){

                if(currentImage < productImages.length - 1){

                    changeImage(
                        currentImage + 1
                    );

                }

            }else{

                if(currentImage > 0){

                    changeImage(
                        currentImage - 1
                    );

                }

            }

        }

    },
    {passive:true}
);


/* ================= COLOR ================= */

let selectedColor = "Black";


function selectColor(color,button){

    selectedColor = color;


    document.getElementById(
        "selectedColor"
    ).textContent = color;


    document
        .querySelectorAll(".color-option")
        .forEach(function(item){

            item.classList.remove("active");

        });


    button.classList.add("active");


    /*
      The available product photos are
      currently black.

      When White/Beige product photos are
      uploaded, they can be connected here.
    */

}


/* ================= SIZE ================= */

let selectedSize = "L";


function selectSize(size,button){

    selectedSize = size;


    document
        .querySelectorAll(".size-option")
        .forEach(function(item){

            item.classList.remove("active");

        });


    button.classList.add("active");

}


/* ================= QUANTITY ================= */

let quantity = 1;


function changeQuantity(amount){

    quantity += amount;


    if(quantity < 1){

        quantity = 1;

    }


    document.getElementById(
        "quantity"
    ).textContent = quantity;

}


/* ================= CART ================= */

function getCart(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "mainstreamCart"
            )
        ) || [];

    }catch(error){

        return [];

    }

}


function saveCart(cart){

    localStorage.setItem(
        "mainstreamCart",
        JSON.stringify(cart)
    );

}


function updateCartCount(){

    const cart = getCart();


    const count =
        cart.reduce(function(total,item){

            return total +
                (item.quantity || 1);

        },0);


    document.getElementById(
        "cartCount"
    ).textContent = count;

}


function addToCart(){

    const cart = getCart();


    const product = {

        name:"MAX / 03 TEE",

        price:999,

        image:"max-front.png",

        color:selectedColor,

        size:selectedSize,

        quantity:quantity

    };


    const existing =
        cart.find(function(item){

            return item.name === product.name
            &&
            item.color === product.color
            &&
            item.size === product.size;

        });


    if(existing){

        existing.quantity += quantity;

    }else{

        cart.push(product);

    }


    saveCart(cart);

    updateCartCount();


    alert(
        "MAX / 03 TEE added to cart!"
    );

}


/* ================= BUY NOW ================= */

function buyNow(){

    addToCart();

    setTimeout(function(){

        window.location.href =
            "shipping.html";

    },300);

}


/* ================= CART ================= */

function goToCart(){

    window.location.href =
        "cart.html";

}


updateCartCount();

</script>


</body>

</html>
