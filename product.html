<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAINSTREAM™ Product</title>

<style>

/* ================= BASIC ================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f7f2;
    color:#111;
}

/* ================= HEADER ================= */

header{
    height:90px;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    width:220px;
    max-width:55%;
}

.cart-btn{
    background:#ffd400;
    border:0;
    padding:22px 30px;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
}

/* ================= PAGE ================= */

.page{
    max-width:1250px;
    margin:auto;
    padding:50px 35px 80px;
}

.breadcrumb{
    font-size:22px;
    color:#777;
    margin-bottom:40px;
}

/* ================= PRODUCT LAYOUT ================= */

.product-layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:55px;
}

/* ================= GALLERY ================= */

.gallery{
    display:flex;
    gap:20px;
}

.thumbnails{
    width:120px;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.thumb{
    width:120px;
    height:145px;
    background:#eee;
    border:2px solid transparent;
    overflow:hidden;
    cursor:pointer;
}

.thumb.active{
    border:4px solid #111;
}

.thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Front / Back thumbnail crop */

.thumb.front img{
    object-position:left center;
}

.thumb.back img{
    object-position:right center;
}

/* Combined thumbnail */

.thumb.combined img{
    object-fit:contain;
}

/* Size chart */

.thumb.sizechart img{
    object-fit:contain;
}

/* ================= MAIN IMAGE ================= */

.main-image-box{
    flex:1;
    height:650px;
    background:#eee;
    overflow:hidden;
    position:relative;
}

.main-photo{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* Front crop */

.main-photo.front{
    object-position:left center;
}

/* Back crop */

.main-photo.back{
    object-position:right center;
}

/* Combined */

.main-photo.combined{
    object-fit:contain;
}

/* Size chart */

.main-photo.sizechart{
    object-fit:contain;
}

.drag-label{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    background:#222;
    color:#fff;
    padding:16px 30px;
    border-radius:40px;
    font-size:16px;
    white-space:nowrap;
}

/* ================= PRODUCT INFO ================= */

.product-info{
    padding-top:10px;
}

.product-name{
    font-size:52px;
    font-weight:900;
    line-height:1;
    margin-bottom:35px;
}

.product-price{
    font-size:34px;
    font-weight:800;
    margin-bottom:45px;
}

/* ================= SIZE ================= */

.option-group{
    margin-bottom:35px;
}

.option-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:15px;
}

.size-options{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.size-option{
    min-width:60px;
    padding:14px 18px;
    border:2px solid #111;
    background:#fff;
    font-weight:700;
    cursor:pointer;
}

.size-option.active{
    background:#111;
    color:#fff;
}

/* ================= QUANTITY ================= */

.quantity-box{
    display:flex;
    align-items:center;
    margin-bottom:30px;
}

.quantity-box button{
    width:48px;
    height:48px;
    border:2px solid #111;
    background:#fff;
    font-size:24px;
    cursor:pointer;
}

.quantity-number{
    width:60px;
    text-align:center;
    font-size:20px;
    font-weight:700;
}

/* ================= BUTTONS ================= */

.action-buttons{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.add-cart,
.buy-now{
    width:100%;
    padding:20px;
    border:0;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
}

.add-cart{
    background:#111;
    color:#fff;
}

.buy-now{
    background:#ffd400;
    color:#111;
}

.add-cart:hover,
.buy-now:hover,
.cart-btn:hover{
    transform:translateY(-2px);
}

/* ================= DETAILS ================= */

.details{
    margin-top:50px;
    border-top:1px solid #ccc;
    padding-top:30px;
}

.details h3{
    font-size:24px;
    margin-bottom:15px;
}

.details p{
    color:#555;
    line-height:1.7;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

    header{
        height:80px;
        padding:0 20px;
    }

    .logo{
        width:190px;
    }

    .cart-btn{
        padding:17px 20px;
        font-size:15px;
    }

    .page{
        padding:35px 20px 60px;
    }

    .breadcrumb{
        font-size:18px;
        margin-bottom:30px;
    }

    .product-layout{
        display:block;
    }

    .gallery{
        width:100%;
        gap:12px;
    }

    .thumbnails{
        width:82px;
        gap:12px;
    }

    .thumb{
        width:82px;
        height:105px;
    }

    .main-image-box{
        height:480px;
    }

    .product-info{
        margin-top:45px;
    }

    .product-name{
        font-size:38px;
    }

    .product-price{
        font-size:28px;
    }

}

@media(max-width:500px){

    .main-image-box{
        height:420px;
    }

    .drag-label{
        font-size:13px;
        padding:12px 18px;
    }

    .product-name{
        font-size:34px;
    }

}

</style>

</head>

<body>


<!-- ================= HEADER ================= -->

<header>

<a href="index.html">

<img
src="mainstream-logo.png"
class="logo"
alt="MAINSTREAM">

</a>

<button
class="cart-btn"
onclick="location.href='cart.html'">

CART <span id="cartCount">0</span>

</button>

</header>


<!-- ================= PAGE ================= -->

<main class="page">


<div class="breadcrumb">

Home → Shop → Product

</div>


<div class="product-layout">


<!-- ================= GALLERY ================= -->

<section class="gallery">


<div class="thumbnails">


<!-- FRONT -->

<div
class="thumb front active"
onclick="showImage('front',this)">

<img
id="frontThumb"
src="max.jpg"
alt="Front">

</div>


<!-- BACK -->

<div
class="thumb back"
onclick="showImage('back',this)">

<img
id="backThumb"
src="max.jpg"
alt="Back">

</div>


<!-- COMBINED -->

<div
class="thumb combined"
onclick="showImage('combined',this)">

<img
id="combinedThumb"
src="max.jpg"
alt="Combined">

</div>


<!-- SIZE CHART -->

<div
class="thumb sizechart"
onclick="showImage('sizechart',this)">

<img
src="size-chart.png"
alt="Size Chart">

</div>


</div>


<!-- MAIN IMAGE -->

<div
class="main-image-box"
id="imageBox">

<img
id="mainProductImage"
class="main-photo front"
src="max.jpg"
alt="Product">

<div class="drag-label">

↔ DRAG TO ROTATE

</div>

</div>


</section>


<!-- ================= PRODUCT INFO ================= -->

<section class="product-info">


<h1
class="product-name"
id="productName">

MAX / 03 TEE

</h1>


<div class="product-price">

₹999

</div>


<!-- ================= SIZE ================= -->

<div class="option-group">

<div class="option-title">

SIZE

</div>


<div class="size-options">


<button
class="size-option"
onclick="selectSize('S',this)">

S

</button>


<button
class="size-option active"
onclick="selectSize('M',this)">

M

</button>


<button
class="size-option"
onclick="selectSize('L',this)">

L

</button>


<button
class="size-option"
onclick="selectSize('XL',this)">

XL

</button>


<button
class="size-option"
onclick="selectSize('XXL',this)">

XXL

</button>


</div>

</div>


<!-- ================= QUANTITY ================= -->

<div class="option-title">

QUANTITY

</div>


<div class="quantity-box">


<button
onclick="changeQuantity(-1)">

−

</button>


<div
class="quantity-number"
id="quantity">

1

</div>


<button
onclick="changeQuantity(1)">

+

</button>


</div>


<!-- ================= BUTTONS ================= -->

<div class="action-buttons">


<button
class="add-cart"
onclick="addToCart()">

ADD TO CART

</button>


<button
class="buy-now"
onclick="buyNow()">

BUY NOW

</button>


</div>


<!-- ================= DETAILS ================= -->

<div class="details">

<h3>

PRODUCT DETAILS

</h3>

<p>

Premium oversized tee designed for everyday
streetwear with a racing-inspired look.
Comfortable fit with a clean MAINSTREAM™ aesthetic.

</p>

</div>


</section>

</div>

</main>


<script>

/* ================= PRODUCT DATA ================= */

const products = {

    max:{
        name:"MAX / 03 TEE",
        front:"max-front.png",
        back:"max-back.png"
    },

    lewis:{
        name:"LEWIS / 44 TEE",
        front:"lewis-front.png",
        back:"lewis-back.png"
    },

    charles:{
        name:"CHARLES / 16 TEE",
        front:"charles-front.png",
        back:"charles-back.png"
    },

    lando:{
        name:"LANDO / 01 TEE",
        front:"lando-front.png",
        back:"lando-back.png"
    },

    oscar:{
        name:"OSCAR / 81 TEE",
        front:"oscar-front.png",
        back:"oscar-back.png"
    },

    george:{
        name:"GEORGE / 63 TEE",
        front:"george-front.png",
        back:"george-back.png"
    },

    kimi:{
        name:"KIMI / 12 TEE",
        front:"kimi-front.png",
        back:"kimi-back.png"
    }

};


/* ================= GET PRODUCT ================= */

const params =
new URLSearchParams(
window.location.search
);

const productKey =
params.get("product") || "max";


const currentProduct =
products[productKey] || products.max;


/* ================= SET PRODUCT ================= */

document.getElementById(
"productName"
).textContent =
currentProduct.name;


document.getElementById(
"frontThumb"
).src =
currentProduct.image;


document.getElementById(
"backThumb"
).src =
currentProduct.image;


document.getElementById(
"combinedThumb"
).src =
currentProduct.image;


const mainImage =
document.getElementById(
"mainProductImage"
);


mainImage.src =
currentProduct.image;


/* ================= GALLERY ================= */

let currentView =
"front";


function showImage(type,button){

    currentView = type;


    document
    .querySelectorAll(".thumb")
    .forEach(function(item){

        item.classList.remove(
            "active"
        );

    });


    button.classList.add(
        "active"
    );


    mainImage.className =
        "main-photo " + type;


    mainImage.src =
        currentProduct.image;


    if(type === "sizechart"){

        mainImage.src =
            "size-chart.png";

    }

}


/* ================= SIZE ================= */

let selectedSize =
"M";


function selectSize(
size,
button
){

    selectedSize =
        size;


    document
    .querySelectorAll(
        ".size-option"
    )
    .forEach(function(item){

        item.classList.remove(
            "active"
        );

    });


    button.classList.add(
        "active"
    );

}


/* ================= QUANTITY ================= */

let quantity = 1;


function changeQuantity(
amount
){

    quantity += amount;


    if(quantity < 1){

        quantity = 1;

    }


    document.getElementById(
        "quantity"
    ).textContent =
        quantity;

}


/* ================= CART ================= */

function getCart(){

    return JSON.parse(

        localStorage.getItem(
            "mainstreamCart"
        ) || "[]"

    );

}


function saveCart(cart){

    localStorage.setItem(

        "mainstreamCart",

        JSON.stringify(cart)

    );

}


function addToCart(){

    const cart =
        getCart();


    cart.push({

        name:
            currentProduct.name,

        price:
            999,

        image:
            currentProduct.image,

        size:
            selectedSize,

        quantity:
            quantity

    });


    saveCart(cart);


    updateCartCount();


    alert(
        currentProduct.name +
        " added to cart"
    );

}


/* ================= BUY NOW ================= */

function buyNow(){

    addToCart();


    window.location.href =
        "shipping.html";

}


/* ================= CART COUNT ================= */

function updateCartCount(){

    const cart =
        getCart();


    let total = 0;


    cart.forEach(
        function(item){

            total +=
                Number(
                    item.quantity || 1
                );

        }
    );


    document.getElementById(
        "cartCount"
    ).textContent =
        total;

}


/* ================= SWIPE ================= */

let startX = 0;


const imageBox =
document.getElementById(
    "imageBox"
);


imageBox.addEventListener(
    "touchstart",
    function(event){

        startX =
            event.touches[0].clientX;

    }
);


imageBox.addEventListener(
    "touchend",
    function(event){

        const endX =
            event.changedTouches[0].clientX;


        const difference =
            endX - startX;


        if(
            Math.abs(difference)
            < 50
        ){

            return;

        }


        if(difference < 0){

            nextGallery();

        }
        else{

            previousGallery();

        }

    }
);


/* ================= GALLERY NAVIGATION ================= */

function nextGallery(){

    const views = [

        "front",
        "back",
        "combined",
        "sizechart"

    ];


    let index =
        views.indexOf(
            currentView
        );


    index++;


    if(index >= views.length){

        index = 0;

    }


    const buttons =
        document.querySelectorAll(
            ".thumb"
        );


    showImage(
        views[index],
        buttons[index]
    );

}


function previousGallery(){

    const views = [

        "front",
        "back",
        "combined",
        "sizechart"

    ];


    let index =
        views.indexOf(
            currentView
        );


    index--;


    if(index < 0){

        index =
            views.length - 1;

    }


    const buttons =
        document.querySelectorAll(
            ".thumb"
        );


    showImage(
        views[index],
        buttons[index]
    );

}


/* ================= START ================= */

updateCartCount();

</script>


</body>
</html>
